name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      # The README's dependency matrix is generated from the real import graph —
      # a stale one would be a diagram that drifted, which is the whole point.
      - run: npm run graph:check
      - run: npm test
      - run: npm run build
